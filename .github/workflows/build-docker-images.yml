name: CI and publish

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  server:
    name: Server quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ./server/yarn.lock
          package-manager-cache: false

      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile

      - name: Lint
        run: npx --yes yarn@1.22.22 lint

      - name: Build
        run: npx --yes yarn@1.22.22 build

      - name: Run API tests
        run: npx --yes yarn@1.22.22 test:e2e --runInBand

      - name: Run live-stack integration tests
        run: npx --yes yarn@1.22.22 test:integration

  extension:
    name: Chrome extension build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./chrome-extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ./chrome-extension/yarn.lock
          package-manager-cache: false

      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile

      - name: Run extension unit tests
        run: npx --yes yarn@1.22.22 test

      - name: Audit production dependencies
        run: npx --yes yarn@1.22.22 audit --groups dependencies --level high

      - name: Build packaged extension
        run: npx --yes yarn@1.22.22 package

      - name: Install Chrome for Testing
        shell: bash
        run: |
          chrome_revision="$(node -p "require('puppeteer-core').PUPPETEER_REVISIONS.chrome")"
          chrome_path="$(npx --no-install browsers install "chrome@${chrome_revision}" --path "$RUNNER_TEMP/notelix-chrome" --format '{{path}}')"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Run unpacked extension in Chrome
        shell: bash
        run: |
          xvfb-run --auto-servernum npx --yes yarn@1.22.22 smoke:browser "$CHROME_PATH"

  build:
    name: Build ${{ matrix.target }} image
    needs:
      - server
      - extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: prod
            dockerfile: ./server/Dockerfile.prod
          - target: agent
            dockerfile: ./server/Dockerfile.agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ matrix.target }}-,suffix=,format=short
            type=ref,event=branch,prefix=${{ matrix.target }}-
            type=ref,event=pr,prefix=${{ matrix.target }}-pr-
            type=raw,value=${{ matrix.target }},enable=${{ github.ref_name == github.event.repository.default_branch }}
            type=raw,value=latest,enable=${{ matrix.target == 'prod' && github.ref_name == github.event.repository.default_branch }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: mode=max
          sbom: true
