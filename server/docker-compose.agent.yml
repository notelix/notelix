services:
  backend:
    image: ${NOTELIX_AGENT_IMAGE:-notelix:agent}
    restart: unless-stopped
#    command: [ "sh", "-c", "sleep 3000" ]
    ports:
      - "127.0.0.1:18565:3000"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file:
      - .env.agent
    environment:
      RUN_MODE: AGENT
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      AGENT_CONTROL_ORIGINS: ${AGENT_CONTROL_ORIGINS:?AGENT_CONTROL_ORIGINS is required}
#      - AGENT_SYNC_URL_OVERRIDE=http://notelix-dev_backend_1:3000
    volumes:
      - data:/data
  postgres:
    image: "postgres:14.24-alpine"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:18566:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  meilisearch:
    image: "getmeili/meilisearch:v1.51.0"
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-v1:/meili_data
    ports:
      - "127.0.0.1:18567:7700"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://127.0.0.1:7700/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  data:
  meili-v1:
