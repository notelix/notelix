services:
  backend:
    image: notelix:dev
    restart: unless-stopped
    #    command: [ "sh", "-c", "sleep 3000" ]
    ports:
      - "127.0.0.1:18555:3000"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src
      - ./tools:/app/tools
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - ./ormconfig.js:/app/ormconfig.js
      - ./.env.dev:/app/.env
      - data:/data
  postgres:
    image: "postgres:14.24-alpine"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:18556:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  meilisearch:
    image: "getmeili/meilisearch:v1.51.0"
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-v1:/meili_data
    ports:
      - "127.0.0.1:18557:7700"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://127.0.0.1:7700/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  data:
  meili-v1:
