services:
  backend:
    image: ${NOTELIX_BACKEND_IMAGE:-notelix:prod}
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "${NOTELIX_BIND_ADDRESS:-127.0.0.1}:${NOTELIX_PORT:-18555}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
    volumes:
      - data:/data
  postgres:
    image: "postgres:17.11-alpine"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  meilisearch:
    image: "getmeili/meilisearch:v1.51.0"
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://127.0.0.1:7700/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  data:
  meili-data:
