services:
  backend:
    image: ${NOTELIX_BACKEND_IMAGE:-notelix:prod}
    restart: unless-stopped
    ports:
      - "18555:3000"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file:
      - .env.prod
    volumes:
      - data:/data
  postgres:
    image: "postgres:14"
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=$DB_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  meilisearch:
    image: "getmeili/meilisearch:v0.25.2"
    restart: unless-stopped
    volumes:
      - meili:/data.ms
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://127.0.0.1:7700/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  data:
  meili:
networks:
  default:
    name: notelix
    external: true
